services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    environment:
      POSTGRES_DB: r2r
      POSTGRES_USER: r2r
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: ["postgres", "-c", "max_connections=256"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r2r -d r2r"]
      interval: 5s
      timeout: 5s
      retries: 20

  graph-clustering:
    image: ragtoriches/cluster-prod@sha256:53bcbcc114fe08906b6df6b4d3863644145b1efa240fd6643ef65986593938b6
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7276/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  r2r:
    build: .
    environment:
      R2R_HOST: 0.0.0.0
      R2R_PORT: 7272
      R2R_LOG_LEVEL: INFO
      R2R_PROJECT_NAME: railway_r2r
      R2R_SECRET_KEY: ${R2R_SECRET_KEY:?R2R_SECRET_KEY is required}
      R2R_ADMIN_EMAIL: ${R2R_ADMIN_EMAIL:?R2R_ADMIN_EMAIL is required}
      R2R_ADMIN_PASSWORD: ${R2R_ADMIN_PASSWORD:?R2R_ADMIN_PASSWORD is required}
      R2R_POSTGRES_HOST: postgres
      R2R_POSTGRES_PORT: 5432
      R2R_POSTGRES_DBNAME: r2r
      R2R_POSTGRES_USER: r2r
      R2R_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      R2R_POSTGRES_MAX_CONNECTIONS: 64
      R2R_POSTGRES_STATEMENT_CACHE_SIZE: 100
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      OPENAI_BASE_URL: ${OPENAI_API_BASE:-}
      CLUSTERING_SERVICE_URL: http://graph-clustering:7276
      HATCHET_CLIENT_TLS_STRATEGY: none
    ports:
      - "7272:7272"
    depends_on:
      postgres:
        condition: service_healthy
      graph-clustering:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7272/v3/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  dashboard:
    image: sciphiai/r2r-dashboard:1.0.3@sha256:ba9bcb43c5e7d7d4eb9fe38970f976f6a0842297f3da078cb6223d1f078741d1
    environment:
      NEXT_PUBLIC_R2R_DEPLOYMENT_URL: ${R2R_PUBLIC_URL:-http://localhost:7272}
      NEXT_PUBLIC_R2R_DEFAULT_EMAIL: ${R2R_ADMIN_EMAIL:?R2R_ADMIN_EMAIL is required}
      NEXT_PUBLIC_R2R_DEFAULT_PASSWORD: ${R2R_ADMIN_PASSWORD:?R2R_ADMIN_PASSWORD is required}
      R2R_DASHBOARD_DISABLE_TELEMETRY: "true"
    ports:
      - "7273:3000"
    depends_on:
      r2r:
        condition: service_healthy

  mock-openai:
    profiles: ["test"]
    image: python:3.12-alpine@sha256:6d43704baacd1bfbe7c295d7f13079d5d8104ed33568873133f8fc69980419df
    command: ["python", "/mock-openai.py"]
    volumes:
      - ./scripts/mock-openai.py:/mock-openai.py:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  postgres-data:
